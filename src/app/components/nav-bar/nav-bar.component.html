<nav class="app-navbar">
  <div class="navbar-container">
    <!-- Brand Logo & App Title -->
    <a class="navbar-brand" routerLink="home">
      <img src="assets/img/mainLogo.webp" height="42" alt="Ballistica" class="brand-logo" onerror="this.src='assets/img/mainLogo.png'" />
      <div class="brand-text-block">
        <span class="brand-name">Server Manager</span>
        <span class="brand-badge">Tool</span>
      </div>
    </a>

    <!-- Mobile Menu Toggle Button -->
    <button class="mobile-toggle-btn" type="button" (click)="onBurgerClicked()" [class.active]="active" aria-label="Toggle navigation">
      <span class="toggle-bar"></span>
      <span class="toggle-bar"></span>
      <span class="toggle-bar"></span>
    </button>

    <!-- Navigation Links & Actions -->
    <div class="navbar-content" [class.show]="active">
      <ul class="nav-links">
        <li class="nav-item">
          <a class="nav-link" routerLink="home" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}" (click)="closeMenu()">
            <mat-icon class="nav-icon">home</mat-icon>
            <span>Home</span>
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" routerLink="leaderboard" routerLinkActive="active" (click)="closeMenu()">
            <mat-icon class="nav-icon">leaderboard</mat-icon>
            <span>Leaderboard</span>
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" routerLink="switch-server" routerLinkActive="active" (click)="closeMenu()">
            <mat-icon class="nav-icon">dns</mat-icon>
            <span>Servers</span>
          </a>
        </li>
        <li class="nav-item">
          <a
            class="nav-link"
            [routerLink]="isLoggedIn ? 'admin' : 'login'"
            routerLinkActive="active"
            (click)="closeMenu()"
            [title]="isLoggedIn ? 'Admin Panel (Unlocked)' : 'Admin Login (Locked)'"
          >
            <mat-icon class="nav-icon" [class.locked-icon]="!isLoggedIn">{{ isLoggedIn ? 'admin_panel_settings' : 'lock' }}</mat-icon>
            <span>{{ isLoggedIn ? 'Admin' : 'Admin Login' }}</span>
          </a>
        </li>
        <li class="nav-item" *ngIf="undercommunityDomain">
          <a class="nav-link community-link" href="https://bombsquad-community.web.app" target="_blank" rel="noopener noreferrer">
            <mat-icon class="nav-icon">open_in_new</mat-icon>
            <span>Main Website</span>
          </a>
        </li>
      </ul>

      <!-- Right Side Actions: Active Server Badge & Discord Button -->
      <div class="nav-actions">
        <!-- Active Server Badge Pill -->
        <a class="active-server-pill" routerLink="switch-server" (click)="closeMenu()" title="Click to switch or manage servers">
          <span class="status-dot"></span>
          <div class="server-pill-info">
            <span class="server-pill-name">{{ serverName || 'Ballistica Server' }}</span>
            <span class="server-pill-host">{{ activeHost }}</span>
          </div>
          <mat-icon class="pill-arrow">sync_alt</mat-icon>
        </a>

        <!-- Discord Button -->
        <button type="button" class="btn-discord" (click)="openDiscord()" title="Join Discord Server">
          <svg class="discord-svg" viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
            <path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028c.462-.63.874-1.295 1.226-1.994.021-.041.001-.09-.041-.106a13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.929 1.793 8.18 1.793 12.061 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.894.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.028zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.956-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.956 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.946 2.418-2.157 2.418z"/>
          </svg>
          <span class="discord-label">Discord</span>
        </button>
      </div>
    </div>
  </div>
</nav>
