<div class="admin-tool-page settings-page">
  <!-- Top Bar -->
  <div class="tool-top-bar">
    <div class="tool-title-group">
      <h2><mat-icon class="title-icon">tune</mat-icon> Server Game Settings</h2>
      <p>Configure gameplay features, AFK timers, night mode, announcements, powerup quantities, and web passwords.</p>
    </div>

    <button
      type="button"
      class="btn-primary-glow btn-save-settings"
      (click)="onSubmit()"
      [disabled]="isSaving || !modified || !isValid"
    >
      <mat-icon [class.spinning]="isSaving">save</mat-icon>
      <span>{{ isSaving ? 'Saving...' : 'Save Settings' }}</span>
    </button>
  </div>

  <div class="table-loading-state" *ngIf="isLoading">
    <mat-spinner diameter="36"></mat-spinner>
    <p>Loading server settings configuration...</p>
  </div>

  <!-- Settings Form Container -->
  <div class="glass-card settings-form-card" *ngIf="!isLoading">
    <form class="dynamic-settings-form">
      <app-reactive-form [formGroup]="formGroup"></app-reactive-form>
    </form>
  </div>

  <!-- Sticky Save Banner when modified -->
  <div class="sticky-save-banner glass-card" *ngIf="modified">
    <div class="save-banner-info">
      <mat-icon class="alert-icon">info</mat-icon>
      <span>{{ isValid ? 'Settings modified. Save to apply.' : 'Please fix invalid inputs before saving.' }}</span>
    </div>
    <button
      type="button"
      class="btn-primary-glow btn-save-banner"
      (click)="onSubmit()"
      [disabled]="isSaving || !isValid"
    >
      <mat-icon [class.spinning]="isSaving">save</mat-icon>
      <span>{{ isSaving ? 'Saving...' : 'Save Settings' }}</span>
    </button>
  </div>
</div>
